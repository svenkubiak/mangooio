# Application configuration
#
# The configuration consists of default values that are common in all environments and
# environment specific values for dev, test, and prod.
#
# Values in an active environment overwrite default values
#
# Default configuration:

default:
  application:
    name: ${application-name}
    secret: application.secret
    language: en
    vault:
      enable: true
  connector:
    http:
      host: localhost
      port: 8080
  session:
    cookie:
      name: ${application-name}-session
      secret: vault{}
      key: vault{}
      secure: true
  authentication:
    hashing:
      # Maximum number of Argon2 hashes computed at the same time, 0 derives the
      # value from the configured memory cost and the available heap.
      # Time in milliseconds a request waits for a free slot before hashing is
      # rejected with a MangooHashingException
      concurrency: 0
      timeout: 5000
      # WARNING Changing memory, iterations or parallelism invalidates every hash
      # that has already been stored. Affected users can no longer log in. Only
      # change these together with a rehash on the next successful login
      # memory: 80000
      # iterations: 6
      # parallelism: 2
    redirect: /login
    cookie:
      name: ${application-name}-authentication
      secret: vault{}
      key: vault{}
      secure: true
  token:
    secret: token.secret
  flash:
    cookie:
      name: ${application-name}-flash
      secret: vault{}
      key: vault{}
      secure: true
  smtp:
    host: localhost
    port: 25

# Environments configuration:

environments:
  test:
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: vault{}
        key: vault{}
        secure: false
    flash:
      cookie:
        secret: vault{}
        key: vault{}
        secure: false
    authentication:
      cookie:
        secret: vault{}
        key: vault{}
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models
    
  dev:
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: vault{}
        key: vault{}
        secure: false
    flash:
      cookie:
        secret: vault{}
        key: vault{}
        secure: false
    authentication:
      cookie:
        secret: vault{}
        key: vault{}
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models

  prod:
    connector:
      http:
        port: 9090
    session:
      cookie:
        secure: true
    flash:
      cookie:
        secure: true
    authentication:
      cookie:
        secure: true
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019
        package: models