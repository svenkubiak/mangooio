# Application configuration
#
# The configuration consists of default values that are common in all environments and
# environment specific values for dev, test, and prod.
#
# Values in an active environment overwrite default values
#
# Secrets in dev and test have been generated with the project. In prod they must come from
# outside the JAR: env{} reads an environment variable (session.cookie.secret -> SESSION_COOKIE_SECRET),
# arg{} a JVM argument and file{} a file in /run/secrets (APPLICATION_SECRETS_PATH).
#
# Default configuration:

default:
  application:
    name: ${application-name}
    language: en
  connector:
    http:
      host: localhost
      port: 8080
  session:
    cookie:
      name: ${application-name}-session
      secure: true
  authentication:
    hashing:
      # Concurrent Argon2 hashes, 0 derives the limit from memory cost and heap
      concurrency: 0
      # Milliseconds to wait for a free slot before a MangooHashingException
      timeout: 5000
      # Stored hashes keep their own parameters, see CommonUtils.needsRehash
      # memory: 32768
      # iterations: 3
      # parallelism: 1
    redirect: /login
    cookie:
      name: ${application-name}-authentication
      secure: true
  flash:
    cookie:
      name: ${application-name}-flash
      secure: true
  smtp:
    host: localhost
    port: 25

# Environments configuration:

environments:
  test:
    application:
      secret: generated.secret
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: generated.secret
        key: generated.secret
        secure: false
    flash:
      cookie:
        secret: generated.secret
        key: generated.secret
        secure: false
    authentication:
      cookie:
        secret: generated.secret
        key: generated.secret
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019

  dev:
    application:
      secret: generated.secret
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: generated.secret
        key: generated.secret
        secure: false
    flash:
      cookie:
        secret: generated.secret
        key: generated.secret
        secure: false
    authentication:
      cookie:
        secret: generated.secret
        key: generated.secret
        secure: false
    persistence:
      mongo:
        embedded: true
        host: localhost
        port: 29019

  prod:
    application:
      secret: env{}
    connector:
      http:
        port: 9090
    session:
      cookie:
        secret: env{}
        key: env{}
        secure: true
    flash:
      cookie:
        secret: env{}
        key: env{}
        secure: true
    authentication:
      cookie:
        secret: env{}
        key: env{}
        secure: true
    persistence:
      mongo:
        host: localhost
        port: 27017